<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>存档修改器</title>
  <style>
    @font-face {
      font-family: 'MiSansVF';
      src: url('../MiSansVF.ttf') format('truetype');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --text: #eef0f6;
      --text-dim: #8b91a7;
      --blue: #4d96ff;
      --green: #3ddc84;
      --yellow: #ffd93d;
      --red: #ff5c6c;
    }

    body {
      font-family: 'MiSansVF', 'MiSans', 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif;
      background:
        radial-gradient(900px 500px at -10% -10%, rgba(255, 107, 107, 0.16), transparent 60%),
        radial-gradient(900px 500px at 110% -10%, rgba(77, 150, 255, 0.18), transparent 60%),
        linear-gradient(160deg, #0f1022 0%, #12142b 45%, #0b0d1c 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 30px 20px 100px;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .header {
      text-align: center;
      padding: 10px 0 6px;
    }

    .header-logo {
      width: 460px;
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto 14px;
      border-radius: 14px;
      filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.5));
    }

    .header .subtitle {
      color: var(--text-dim);
      font-size: 0.9em;
      margin-top: 6px;
      letter-spacing: 0.5px;
    }

    .card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 16px;
      padding: 18px 20px;
      backdrop-filter: blur(8px);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }

    .card-title {
      font-size: 1.05em;
      font-weight: 600;
    }

    .step-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.22);
      font-size: 0.75em;
      font-weight: 700;
      color: var(--text);
      margin-right: 8px;
      flex-shrink: 0;
      vertical-align: middle;
    }

    .card-hint {
      font-size: 0.8em;
      color: var(--text-dim);
    }

    .file-section {
      border-style: dashed;
      border-color: rgba(77, 150, 255, 0.45);
    }

    .file-content {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .file-icon {
      font-size: 1.9em;
    }

    .file-text {
      flex: 1;
      min-width: 220px;
    }

    .file-title {
      font-weight: 600;
      margin-bottom: 4px;
    }

    .file-info {
      color: var(--text-dim);
      font-size: 0.84em;
      word-break: break-all;
      line-height: 1.5;
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 11px 18px;
      font-size: 0.92em;
      font-weight: 600;
      color: #ffffff;
      cursor: pointer;
      letter-spacing: 0.3px;
      transition: transform 0.18s ease, filter 0.18s ease, background 0.18s ease;
    }

    .btn:hover { transform: translateY(-2px); filter: brightness(1.08); }
    .btn:active { transform: scale(0.97); }

    .btn-primary {
      background: linear-gradient(135deg, #ff6b6b, #ff9f43);
      box-shadow: 0 4px 14px rgba(255, 107, 107, 0.28);
    }

    .btn-ghost {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.14);
    }

    .btn-ghost:hover { background: rgba(255, 255, 255, 0.14); }

    .btn-outline {
      background: transparent;
      border: 1px solid rgba(77, 150, 255, 0.6);
      color: var(--blue);
    }

    .btn-outline:hover { background: rgba(77, 150, 255, 0.12); }

    .btn-save {
      background: linear-gradient(135deg, #4d96ff, #4dd0e1);
      box-shadow: 0 4px 16px rgba(77, 150, 255, 0.32);
      font-size: 1em;
      padding: 14px 28px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
    }

    .stat-item {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 14px 12px;
      border-radius: 12px;
      text-align: center;
    }

    .stat-item .label {
      font-size: 0.75em;
      color: var(--text-dim);
      margin-bottom: 6px;
    }

    .stat-item .value {
      font-size: 1.22em;
      font-weight: 700;
      color: var(--green);
    }

    /* ===== 关卡编辑器：左侧列表 + 右侧编辑面板 ===== */
    .editor-layout {
      display: flex;
      gap: 16px;
      align-items: flex-start;
    }

    .level-list-panel {
      flex: 1;
      min-width: 0;
    }

    .list-toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .list-toolbar input,
    .list-toolbar select {
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(0, 0, 0, 0.35);
      color: var(--text);
      font-size: 0.9em;
      outline: none;
    }

    .list-toolbar input { flex: 1; min-width: 120px; }
    .list-toolbar select { cursor: pointer; }

    .level-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 2px;
    }

    .level-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-left: 3px solid transparent;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
    }

    .level-row:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.22);
    }

    .level-row.selected {
      background: rgba(77, 150, 255, 0.14);
      border-color: var(--blue);
      box-shadow: 0 0 0 1px rgba(77, 150, 255, 0.4);
    }

    .level-row.completed .level-badge {
      background: linear-gradient(135deg, #3ddc84, #2bb5c9);
    }

    .level-badge {
      flex-shrink: 0;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85em;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.22);
    }

    .level-badge.large {
      width: 44px;
      height: 44px;
      font-size: 1.05em;
    }

    .level-info {
      flex: 1;
      min-width: 0;
    }

    .level-title {
      font-weight: 600;
      margin-bottom: 3px;
    }

    .level-meta {
      font-size: 0.78em;
      color: var(--text-dim);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .level-flag {
      flex-shrink: 0;
      font-size: 0.95em;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .speed-tag {
      font-size: 0.75em;
      color: var(--yellow);
      font-weight: 600;
      background: rgba(255, 217, 61, 0.12);
      border: 1px solid rgba(255, 217, 61, 0.3);
      border-radius: 999px;
      padding: 2px 8px;
    }

    .editor-panel {
      flex: 0 0 300px;
      position: sticky;
      top: 16px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .editor-head {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 4px;
    }

    .editor-title {
      font-weight: 700;
      font-size: 1.1em;
    }

    .editor-empty {
      color: var(--text-dim);
      font-size: 0.88em;
      line-height: 1.6;
    }

    .editor-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.85em;
      color: var(--text-dim);
    }

    .editor-field input[type="number"] {
      padding: 9px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(0, 0, 0, 0.35);
      color: var(--text);
      font-size: 1em;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .editor-field input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(77, 150, 255, 0.2);
    }

    .editor-field.editor-toggle {
      flex-direction: row;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
    }

    .editor-field.editor-toggle input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--green);
      cursor: pointer;
    }

    .editor-actions {
      display: flex;
      gap: 10px;
      margin-top: 4px;
    }

    .editor-actions .btn { flex: 1; }

    @media (max-width: 760px) {
      .editor-layout { flex-direction: column; }
      .editor-panel { flex: none; width: 100%; position: static; }
    }

    .save-section {
      position: sticky;
      bottom: 12px;
      background: rgba(16, 18, 36, 0.92);
      border-color: rgba(61, 220, 132, 0.25);
      box-shadow: 0 -6px 24px rgba(0, 0, 0, 0.35);
    }

    .save-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
    }

    .status-bar {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 22px;
      border-radius: 999px;
      display: none;
      font-size: 0.9em;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      z-index: 100;
    }

    .status-bar.show {
      display: block;
      animation: toastIn 0.3s ease forwards;
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translate(-50%, 20px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <img class="header-logo" src="../header_schinese.jpg" alt="冰与火之舞">
      <p class="subtitle">存档修改器 · 轻松解锁所有关卡和成就</p>
    </header>

    <section class="card file-section" id="fileSection">
      <div class="card-header">
        <span class="card-title"><span class="step-badge">1</span>选择存档文件</span>
        <span class="card-hint">选择要修改的 data.sav</span>
      </div>
      <div class="file-content">
        <div class="file-icon">📂</div>
        <div class="file-text">
          <div class="file-info" id="fileInfo">尚未选择文件</div>
        </div>
        <button class="btn btn-outline" onclick="openFile()">浏览文件</button>
      </div>
    </section>

    <section class="card" id="previewSection" style="display: none;">
      <div class="card-header">
        <span class="card-title"><span class="step-badge">2</span>存档概览</span>
        <span class="card-hint">当前存档状态一览</span>
      </div>
      <div class="stats-grid" id="statsGrid"></div>
    </section>

    <section class="card" id="levelEditorSection" style="display: none;">
      <div class="card-header">
        <span class="card-title"><span class="step-badge">3</span>关卡编辑器</span>
        <span class="card-hint">点击左侧关卡，在右侧编辑进度 / 精准度 / X精准度 / 尝试次数</span>
      </div>
      <div class="editor-layout">
        <div class="level-list-panel">
          <div class="list-toolbar">
            <input type="text" id="levelSearch" placeholder="🔍 搜索关卡号…" oninput="generateLevelList()">
            <select id="levelFilter" onchange="generateLevelList()">
              <option value="all">全部</option>
              <option value="completed">已完成</option>
              <option value="uncompleted">未完成</option>
            </select>
            <select id="levelSort" onchange="generateLevelList()">
              <option value="num">按关卡号</option>
              <option value="accuracy">精准度 ↓</option>
              <option value="attempts">尝试次数 ↓</option>
            </select>
          </div>
          <div class="level-list" id="levelList"></div>
        </div>
        <div class="editor-panel" id="editorPanel">
          <div class="editor-empty">👈 点击左侧关卡，在此编辑该关卡的属性</div>
        </div>
      </div>
    </section>

    <section class="card save-section" id="saveSection" style="display: none;">
      <div class="card-header">
        <span class="card-title"><span class="step-badge">4</span>保存修改</span>
        <span class="card-hint">将修改写入存档</span>
      </div>
      <div class="save-actions">
        <button class="btn btn-save" onclick="saveFile()">❄️ 保存修改</button>
        <button class="btn btn-ghost" onclick="saveAsFile()">📄 另存为</button>
      </div>
    </section>
  </div>

  <div class="status-bar" id="statusBar"></div>

  <!-- 平台抽象层：检测 → 样式 Token → 事件差异化 → 组件行为（顺序不可调换） -->
  <script src="platform/platform.js"></script>
  <script src="platform/platformStyles.js"></script>
  <script src="platform/interactions.js"></script>
  <script src="platform/components.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
