[package]
name = "adofai-save-editor"
version = "1.0.0"
description = "Adofai Save Editor"
edition = "2021"
rust-version = "1.77"

[lib]
name = "adofai_save_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
ureq = "2"
url = "2"
base64 = "0.22"
