<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>存档修改器</title>
  <style>
    @font-face {
      font-family: 'MiSansVF';
      src: url('../MiSansVF.ttf') format('truetype');
      font-weight: 100 900;
      font-style: normal;
      font-display: swap;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --text: #eef0f6;
      --text-dim: #8b91a7;
      --blue: #4d96ff;
      --green: #3ddc84;
      --yellow: #ffd93d;
      --red: #ff5c6c;
    }

    body {
      font-family: 'MiSansVF', 'MiSans', 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif;
      background:
        radial-gradient(900px 500px at -10% -10%, rgba(255, 107, 107, 0.16), transparent 60%),
        radial-gradient(900px 500px at 110% -10%, rgba(77, 150, 255, 0.18), transparent 60%),
        linear-gradient(160deg, #0f1022 0%, #12142b 45%, #0b0d1c 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 30px 20px 100px;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .header {
      text-align: center;
      padding: 10px 0 6px;
    }

    .header-logo {
      width: 460px;
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto 14px;
      border-radius: 14px;
      filter: drop-shadow(0 10px 30px rgba(0, 0, 0, 0.5));
    }

    .header .subtitle {
      color: var(--text-dim);
      font-size: 0.9em;
      margin-top: 6px;
      letter-spacing: 0.5px;
    }

    .card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 16px;
      padding: 18px 20px;
      backdrop-filter: blur(8px);
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }

    .card-title {
      font-size: 1.05em;
      font-weight: 600;
    }

    .step-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.22);
      font-size: 0.75em;
      font-weight: 700;
      color: var(--text);
      margin-right: 8px;
      flex-shrink: 0;
      vertical-align: middle;
    }

    .card-hint {
      font-size: 0.8em;
      color: var(--text-dim);
    }

    .file-section {
      border-style: dashed;
      border-color: rgba(77, 150, 255, 0.45);
    }

    .file-content {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .file-icon {
      font-size: 1.9em;
    }

    .file-text {
      flex: 1;
      min-width: 220px;
    }

    .file-title {
      font-weight: 600;
      margin-bottom: 4px;
    }

    .file-info {
      color: var(--text-dim);
      font-size: 0.84em;
      word-break: break-all;
      line-height: 1.5;
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 11px 18px;
      font-size: 0.92em;
      font-weight: 600;
      color: #ffffff;
      cursor: pointer;
      letter-spacing: 0.3px;
      transition: transform 0.18s ease, filter 0.18s ease, background 0.18s ease;
    }

    .btn:hover { transform: translateY(-2px); filter: brightness(1.08); }
    .btn:active { transform: scale(0.97); }

    .btn-primary {
      background: linear-gradient(135deg, #ff6b6b, #ff9f43);
      box-shadow: 0 4px 14px rgba(255, 107, 107, 0.28);
    }

    .btn-success {
      background: linear-gradient(135deg, #3ddc84, #2bb5c9);
      box-shadow: 0 4px 14px rgba(61, 220, 132, 0.25);
    }

    .btn-warning {
      background: linear-gradient(135deg, #ffd93d, #ff9f43);
      color: #3a2d00;
      box-shadow: 0 4px 14px rgba(255, 217, 61, 0.22);
    }

    .btn-blue {
      background: linear-gradient(135deg, #4d96ff, #9b6bff);
      box-shadow: 0 4px 14px rgba(77, 150, 255, 0.28);
    }

    .btn-ghost {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.14);
    }

    .btn-ghost:hover { background: rgba(255, 255, 255, 0.14); }

    .btn-outline {
      background: transparent;
      border: 1px solid rgba(77, 150, 255, 0.6);
      color: var(--blue);
    }

    .btn-outline:hover { background: rgba(77, 150, 255, 0.12); }

    .btn-save {
      background: linear-gradient(135deg, #4d96ff, #4dd0e1);
      box-shadow: 0 4px 16px rgba(77, 150, 255, 0.32);
      font-size: 1em;
      padding: 14px 28px;
    }

    .actions-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 12px;
    }

    .card-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .level-grid,
    .speed-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
      gap: 10px;
      max-height: 380px;
      overflow-y: auto;
      padding: 4px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.2) transparent;
    }

    .level-grid::-webkit-scrollbar,
    .speed-grid::-webkit-scrollbar {
      width: 6px;
    }

    .level-grid::-webkit-scrollbar-thumb,
    .speed-grid::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
    }

    .level-item,
    .speed-item {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 10px 6px;
      text-align: center;
      cursor: pointer;
      transition: all 0.18s ease;
      user-select: none;
    }

    .speed-item {
      border-left: 3px solid var(--speed-color, var(--blue));
    }

    .level-item:hover,
    .speed-item:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.22);
      transform: translateY(-2px);
    }

    .speed-item:hover {
      border-left-color: var(--speed-color, var(--blue));
    }

    .level-item.selected {
      background: rgba(61, 220, 132, 0.16);
      border-color: var(--green);
      box-shadow: 0 0 0 1px rgba(61, 220, 132, 0.4);
    }

    .speed-item.selected {
      background: rgba(77, 150, 255, 0.16);
      border-color: var(--blue);
      border-left-color: var(--speed-color, var(--blue));
      box-shadow: 0 0 0 1px rgba(77, 150, 255, 0.4);
    }

    .level-name,
    .speed-name {
      font-weight: 700;
      font-size: 1.05em;
      margin-bottom: 4px;
    }

    .level-status {
      font-size: 0.75em;
      color: var(--text-dim);
    }

    .level-item.completed .level-status {
      color: var(--green);
    }

    .speed-value {
      font-size: 0.85em;
      color: var(--speed-color, var(--yellow));
      font-weight: 600;
    }

    .speed-control {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .speed-control label {
      color: var(--text-dim);
      font-size: 0.9em;
    }

    .speed-control input {
      width: 90px;
      padding: 9px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(0, 0, 0, 0.35);
      color: var(--text);
      font-size: 1em;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .speed-control input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(77, 150, 255, 0.2);
    }

    .speed-control .unit {
      color: var(--text-dim);
      font-size: 0.9em;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
    }

    .stat-item {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 14px 12px;
      border-radius: 12px;
      text-align: center;
    }

    .stat-item .label {
      font-size: 0.75em;
      color: var(--text-dim);
      margin-bottom: 6px;
    }

    .stat-item .value {
      font-size: 1.22em;
      font-weight: 700;
      color: var(--green);
    }

    .save-section {
      position: sticky;
      bottom: 12px;
      background: rgba(16, 18, 36, 0.92);
      border-color: rgba(61, 220, 132, 0.25);
      box-shadow: 0 -6px 24px rgba(0, 0, 0, 0.35);
    }

    .save-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
    }

    .status-bar {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 22px;
      border-radius: 999px;
      display: none;
      font-size: 0.9em;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      z-index: 100;
    }

    .status-bar.show {
      display: block;
      animation: toastIn 0.3s ease forwards;
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translate(-50%, 20px); }
      to { opacity: 1; transform: translate(-50%, 0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <img class="header-logo" src="../header_schinese.jpg" alt="冰与火之舞">
      <p class="subtitle">存档修改器 · 轻松解锁所有关卡和成就</p>
    </header>

    <section class="card file-section" id="fileSection">
      <div class="card-header">
        <span class="card-title"><span class="step-badge">1</span>选择存档文件</span>
        <span class="card-hint">选择要修改的 data.sav</span>
      </div>
      <div class="file-content">
        <div class="file-icon">📂</div>
        <div class="file-text">
          <div class="file-info" id="fileInfo">尚未选择文件</div>
        </div>
        <button class="btn btn-outline" onclick="openFile()">浏览文件</button>
      </div>
    </section>

    <section class="card" id="previewSection" style="display: none;">
      <div class="card-header">
        <span class="card-title"><span class="step-badge">2</span>存档概览</span>
        <span class="card-hint">当前存档状态一览</span>
      </div>
      <div class="stats-grid" id="statsGrid"></div>
    </section>

    <section class="card" id="actionsSection" style="display: none;">
      <div class="card-header">
        <span class="card-title"><span class="step-badge">3</span>快速修改</span>
        <span class="card-hint">一键完成常用修改</span>
      </div>
      <div class="actions-grid">
        <button class="btn btn-primary" onclick="unlockAll()">🔓 一键全解锁</button>
        <button class="btn btn-success" onclick="maxTutorial()">📚 教程全完成</button>
        <button class="btn btn-warning" onclick="maxDLC()">🏆 DLC 全奖牌</button>
      </div>
    </section>

    <section class="card" id="levelSelectSection" style="display: none;">
      <div class="card-header">
        <span class="card-title"><span class="step-badge">4</span>自定义解锁</span>
        <span class="card-hint">勾选要解锁的关卡（可多选）</span>
      </div>
      <div class="level-grid" id="levelGrid"></div>
      <div class="card-actions">
        <button class="btn btn-primary" onclick="unlockSelected()">🔓 解锁选中</button>
        <button class="btn btn-ghost" onclick="selectAllLevels()">✅ 全选</button>
        <button class="btn btn-ghost" onclick="deselectAllLevels()">❌ 取消全选</button>
      </div>
    </section>

    <section class="card" id="speedTrialSection" style="display: none;">
      <div class="card-header">
        <span class="card-title"><span class="step-badge">5</span>飚速模式</span>
        <span class="card-hint">修改各关卡速度倍率</span>
      </div>
      <div class="speed-control">
        <label for="speedMultiplierInput">目标倍率</label>
        <input type="number" id="speedMultiplierInput" min="0.1" step="0.1" value="1.5">
        <span class="unit">x</span>
        <button class="btn btn-blue" onclick="applySpeedToAll()">🚀 应用到全部</button>
      </div>
      <div class="speed-grid" id="speedGrid"></div>
      <div class="card-actions">
        <button class="btn btn-primary" onclick="applySpeedToSelected()">⚡ 设置选中</button>
        <button class="btn btn-ghost" onclick="selectAllSpeedLevels()">✅ 全选</button>
        <button class="btn btn-ghost" onclick="deselectAllSpeedLevels()">❌ 取消全选</button>
      </div>
    </section>

    <section class="card save-section" id="saveSection" style="display: none;">
      <div class="card-header">
        <span class="card-title"><span class="step-badge">6</span>保存修改</span>
        <span class="card-hint">将修改写入存档</span>
      </div>
      <div class="save-actions">
        <button class="btn btn-save" onclick="saveFile()">❄️ 保存修改</button>
        <button class="btn btn-ghost" onclick="saveAsFile()">📄 另存为</button>
      </div>
    </section>
  </div>

  <div class="status-bar" id="statusBar"></div>

  <!-- 平台抽象层：检测 → 样式 Token → 事件差异化 → 组件行为（顺序不可调换） -->
  <script src="platform/platform.js"></script>
  <script src="platform/platformStyles.js"></script>
  <script src="platform/interactions.js"></script>
  <script src="platform/components.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
